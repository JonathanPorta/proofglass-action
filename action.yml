name: proofglass
description: Enqueue and wait for a Proof Glass Playwright visual regression job

inputs:
  edge-url:
    description: Proof Glass Edge Worker URL
    required: true
  edge-token:
    description: Token allowed to enqueue/poll visual jobs
    required: true
  repo:
    description: GitHub repository in owner/name format
    required: true
  sha:
    description: Commit SHA to test
    required: true
  ref:
    description: Branch, tag, or ref name
    required: true
  pr:
    description: >-
      Pull request number to associate this job with, so it appears on the
      console's PR checks page. Auto-detected from the GitHub event payload on
      pull_request runs when omitted; set explicitly to override.
    required: false
    default: ''
  suite:
    description: Named suite to run
    required: false
    default: visual
  required-capabilities:
    description: Comma-separated required runner capabilities
    required: false
    default: node,make,playwright,chromium
  required-labels:
    description: Comma-separated required runner labels
    required: false
    default: local,trusted
  timeout-seconds:
    description: Maximum time to wait for the remote visual result
    required: false
    default: '1800'
  poll-seconds:
    description: Poll interval
    required: false
    default: '10'
  comment:
    description: >-
      Post a sticky PR comment with the result + failure reasons (opt-in).
      Requires the job's `pull-requests: write` permission.
    required: false
    default: 'false'
  comment-on-pass:
    description: Also comment when the job passes (default: comment only on failure).
    required: false
    default: 'false'
  github-token:
    description: Token used to post the PR comment (needs pull-requests:write).
    required: false
    default: ${{ github.token }}
  comment-author:
    description: >-
      Login the sticky PR comment is authored as, so re-runs update it instead of
      duplicating. Defaults to the built-in github-actions[bot]; set this only when
      overriding github-token with another credential (a GitHub App posts as
      `<app-slug>[bot]`, a PAT as the user login).
    required: false
    default: ''

outputs:
  job-id:
    description: Proof Glass job ID
  status:
    description: Final job status

runs:
  using: node24
  main: dist/index.js
